# Start non-login shell
#set -g default-command "${SHELL}"

# 0 is too far from ` ;)
#set -g base-index 1

# move around panes with j,k,h,l like vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Screen option
#set-option default-terminal "tmux-256color"
#set -g default-terminal "screen-256color"
#set-option -a terminal-overrides ",*256col*:RGB"
set -g default-terminal "xterm-256color"
# Pass truecolor through so vim-clean renders its exact palette
set -as terminal-overrides ",xterm*:RGB,*256col*:RGB"
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g mouse on
setw -g monitor-activity on
set -g mouse on

# Use T as the leader key, not B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Resizing
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# THEME: vim-clean paper (https://github.com/wonkyoc/vim-clean)
set -g status-style "bg=#e7e7e6,fg=#7b7a7a"
set -g window-status-style "bg=#e7e7e6,fg=#7b7a7a"
set -g window-status-current-style "bg=#191919,fg=#f7f6f5,bold"
set -g window-status-activity-style "bg=#e7e7e6,fg=#ac4f23"
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#dcdbdb"
set -g pane-active-border-style "fg=#191919"
set -g message-style "bg=#191919,fg=#f7f6f5"
set -g message-command-style "bg=#191919,fg=#f7f6f5"
setw -g mode-style "bg=#e2ddf6,fg=#191919"
set -g display-panes-colour "#dcdbdb"
set -g display-panes-active-colour "#2200ff"
setw -g clock-mode-colour "#2200ff"
set -g status-interval 60
set -g status-left-length 10
#set -g status-left '#[fg=green](#S) #(whoami) '
#set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'

